services:
  strix:
    build:
      context: .
      dockerfile: Dockerfile
    image: strix-enhanced:latest
    container_name: strix-scanner
    environment:
      - STRIX_LLM=${STRIX_LLM:-openai/gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./workspace:/app/workspace
      - ./test_cases:/app/test_cases
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    working_dir: /app/strix
    # 使用虚拟显示器运行浏览器
    command: >
      bash -c "Xvfb :99 -screen 0 1920x1080x24 & 
               export DISPLAY=:99 && 
               exec sleep infinity"
    # 允许容器访问宿主机网络 (用于扫描本地目标)
    network_mode: host
    restart: unless-stopped
